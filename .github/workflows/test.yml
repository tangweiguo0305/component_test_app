name: Flutter CI/CD 自动测试

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 任务 1: 代码质量检查和单元测试
  test:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤 1: 检出代码
      - uses: actions/checkout@v4
      
      # 步骤 2: 安装 Flutter 和配置环境（使用本地版本 3.38.3）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true
      
      # 步骤 3: 获取项目依赖
      - name: Get dependencies
        run: flutter pub get
      
      # 步骤 4: 代码静态分析 (Lint 检查)
      - name: Analyze code
        run: flutter analyze
        continue-on-error: true
      
      # 步骤 5: 运行所有单元测试和 Widget 测试
      - name: Run tests
        run: flutter test


